[project]
name = "langchain-rag"
version = "0.1.0"
description = "基于智谱 GLM 的 LangChain RAG 知识库问答实战项目"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-community>=0.4",
    "langchain-chroma>=1.1",
    "langchain-text-splitters>=1.1",
    "zhipuai>=2.1",
    "chromadb>=1.5",
    "python-dotenv>=1.0",
    "pypdf>=6.0",
]

# 国内镜像(uv 专用配置):直连 pypi.org 在国内经常超时
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
